name: Stable-Release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  validate:
    name: Release validieren
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      built_at: ${{ steps.release.outputs.built_at }}
      image: ${{ steps.release.outputs.image }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tracker/package-lock.json

      - name: Abhängigkeiten reproduzierbar installieren
        working-directory: tracker
        run: npm ci --ignore-scripts

      - name: Tests ausführen
        working-directory: tracker
        run: npm test

      - name: Veröffentlichungshygiene prüfen
        run: node scripts/check-publication-hygiene.mjs

      - name: Release-Metadaten validieren
        id: release
        run: RELEASE_BUILD_DATE="$(git show -s --format=%cI "$GITHUB_SHA")" node scripts/prepare-release.mjs

      - name: GitHub-Releasezustand fehlersicher prüfen
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/check-release-state.mjs

  publish:
    name: Stable-Release veröffentlichen
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: stable-release
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write

    steps:
      - name: Repository ohne gespeicherten Schreib-Token auschecken
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Aktuellen GitHub-Releasezustand erneut prüfen
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: node scripts/check-release-state.mjs

      - name: QEMU für ARM64 einrichten
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          platforms: arm64

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Bei GHCR anmelden
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Vorhandenes versioniertes Image fehlersicher prüfen
        id: existing_image
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set +e
          inspection="$(docker buildx imagetools inspect "$IMAGE:$VERSION" 2>&1)"
          inspection_status=$?
          set -e

          if [[ $inspection_status -eq 0 ]]; then
            digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r '.digest')"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          elif grep -Eqi 'manifest unknown|not found|name unknown' <<< "$inspection"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "$inspection" >&2
            echo "Der GHCR-Zustand konnte nicht zuverlässig geprüft werden." >&2
            exit 1
          fi

      - name: Neues Image vollständig vorbauen
        if: steps.existing_image.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: false
          outputs: type=cacheonly
          build-args: |
            APP_VERSION=${{ needs.validate.outputs.version }}
            APP_REVISION=${{ github.sha }}
            APP_BUILD_DATE=${{ needs.validate.outputs.built_at }}
          cache-from: type=gha,scope=stable-release
          cache-to: type=gha,mode=max,scope=stable-release
          provenance: false

      - name: Direkt vor dem Push weiterhin aktuellen main bestätigen
        if: steps.existing_image.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: node scripts/check-release-state.mjs

      - name: Versioniertes Multi-Arch-Image veröffentlichen
        if: steps.existing_image.outputs.exists != 'true'
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ needs.validate.outputs.image }}:${{ needs.validate.outputs.version }}
          build-args: |
            APP_VERSION=${{ needs.validate.outputs.version }}
            APP_REVISION=${{ github.sha }}
            APP_BUILD_DATE=${{ needs.validate.outputs.built_at }}
          cache-from: type=gha,scope=stable-release
          cache-to: type=gha,mode=max,scope=stable-release
          provenance: false

      - name: Release-Digest festlegen
        id: release_image
        env:
          BUILD_DIGEST: ${{ steps.push.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.existing_image.outputs.digest }}
        run: |
          digest="${EXISTING_DIGEST:-$BUILD_DIGEST}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Kein gültiger Release-Digest vorhanden." >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Digest, Plattformen und OCI-Metadaten prüfen
        env:
          BUILD_DATE: ${{ needs.validate.outputs.built_at }}
          DIGEST: ${{ steps.release_image.outputs.digest }}
          IMAGE: ${{ needs.validate.outputs.image }}
          REVISION: ${{ github.sha }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          manifest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}')"
          test "$(jq -r '.digest' <<< "$manifest")" = "$DIGEST"
          jq -e '
            [.manifests[].platform | select(.os == "linux") | .architecture]
            | sort == ["amd64", "arm64"]
          ' <<< "$manifest" >/dev/null

          for platform in linux/amd64 linux/arm64; do
            image_config="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format "{{json (index .Image \"$platform\")}}")"
            jq -e \
              --arg build_date "$BUILD_DATE" \
              --arg revision "$REVISION" \
              --arg version "$VERSION" \
              '.config.Labels["org.opencontainers.image.version"] == $version
                and .config.Labels["org.opencontainers.image.revision"] == $revision
                and .config.Labels["org.opencontainers.image.created"] == $build_date' \
              <<< "$image_config" >/dev/null
          done

      - name: Build-Provenienz attestieren
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ needs.validate.outputs.image }}
          subject-digest: ${{ steps.release_image.outputs.digest }}
          push-to-registry: true

      - name: Anonymen Abruf des Release-Images prüfen
        env:
          DIGEST: ${{ steps.release_image.outputs.digest }}
          IMAGE: ${{ needs.validate.outputs.image }}
        run: |
          mkdir -p "$RUNNER_TEMP/anonymous-docker"
          DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker" \
            docker buildx imagetools inspect "$IMAGE@$DIGEST"

      - name: Unmittelbar vor der Freigabe GitHub-Zustand bestätigen
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: node scripts/check-release-state.mjs

      - name: Geprüftes Image als stable freigeben
        env:
          DIGEST: ${{ steps.release_image.outputs.digest }}
          IMAGE: ${{ needs.validate.outputs.image }}
        run: docker buildx imagetools create --tag "$IMAGE:stable" "$IMAGE@$DIGEST"

      - name: Stable-Kanal gegen Release-Digest prüfen
        env:
          DIGEST: ${{ steps.release_image.outputs.digest }}
          IMAGE: ${{ needs.validate.outputs.image }}
        run: |
          stable_digest="$(docker buildx imagetools inspect "$IMAGE:stable" --format '{{json .Manifest}}' | jq -r '.digest')"
          test "$stable_digest" = "$DIGEST"

      - name: GitHub Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          cp release/.env.example "$RUNNER_TEMP/default.env.example"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Rossmann Store Tracker $RELEASE_TAG" \
            --generate-notes \
            --latest \
            release/docker-compose.yml \
            "$RUNNER_TEMP/default.env.example" \
            release/UPDATE.md
