<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Tracker Ersteinrichtung</title>
<desc id="desc">Illustration der Tracker Weboberfläche mit den drei Ersteinrichtungs-Schritten Telegram, Filiale und Produkt.</desc>
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-opacity=".14"/></filter></defs>
<rect width="1200" height="760" fill="#f1eeec"/>
<rect x="0" y="0" width="1200" height="92" fill="#cf1532"/>
<text x="70" y="47" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="27" font-weight="850" fill="#fff">Rossmann Store Tracker</text>
<text x="70" y="73" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#ffe8ec">Lokale Konfiguration, Bestandsprüfung und Telegram-Benachrichtigungen</text>
<rect x="220" y="135" width="760" height="530" rx="20" fill="#fff" stroke="#ded5d1" filter="url(#shadow)"/>
<text x="270" y="185" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="850" fill="#cf1532" letter-spacing="1.2">ERSTEINRICHTUNG</text>
<text x="270" y="230" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="33" font-weight="850" fill="#242121">Telegram-Wächter einrichten</text>
<text x="270" y="265" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#746c69">Der Container prüft Rossmann dauerhaft im Hintergrund und meldet Änderungen.</text>
<rect x="270" y="300" width="190" height="42" rx="21" fill="#fde7ea"/><text x="315" y="326" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="800" fill="#cf1532">1 · Telegram</text>
<rect x="480" y="300" width="190" height="42" rx="21" fill="#f7f4f2"/><text x="530" y="326" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="800" fill="#746c69">2 · Filiale</text>
<rect x="690" y="300" width="190" height="42" rx="21" fill="#f7f4f2"/><text x="740" y="326" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="800" fill="#746c69">3 · Produkt</text>
<text x="270" y="392" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="20" font-weight="800" fill="#242121">Eigenen Telegram-Bot verbinden</text>
<text x="285" y="431" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#4f4845">1. @BotFather öffnen und /newbot senden</text>
<text x="285" y="466" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#4f4845">2. Bot-Token hier einfügen</text>
<text x="285" y="501" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#4f4845">3. Danach Filiale und Produkte auswählen</text>
<rect x="270" y="535" width="510" height="48" rx="10" fill="#fff" stroke="#cfc4bf"/><text x="288" y="565" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#8d8582">123456789:AA...</text>
<rect x="800" y="535" width="120" height="48" rx="11" fill="#cf1532"/><text x="831" y="565" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#fff">Weiter</text>
<rect x="270" y="610" width="650" height="32" rx="10" fill="#e4f5ed"/><text x="290" y="632" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="750" fill="#16734b">Telegram ist optional – der Tracker funktioniert auch nur mit Weboberfläche und History.</text>
</svg>